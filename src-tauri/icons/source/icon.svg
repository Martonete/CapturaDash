<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#18181c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#d9dae0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db8ff"/>
      <stop offset="1" stop-color="#6f8ff0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- captura trasera -->
  <rect x="236" y="250" width="420" height="300" rx="44" fill="none" stroke="#8e8f98" stroke-width="28" stroke-opacity="0.7" transform="rotate(-8 446 400)"/>
  <!-- captura delantera -->
  <g filter="url(#shadow)">
    <rect x="352" y="420" width="440" height="320" rx="48" fill="url(#card)"/>
  </g>
  <rect x="404" y="474" width="150" height="22" rx="11" fill="#9a9ba5" fill-opacity="0.55"/>
  <rect x="404" y="518" width="250" height="22" rx="11" fill="#9a9ba5" fill-opacity="0.35"/>
  <circle cx="712" cy="660" r="46" fill="url(#accent)"/>
</svg>
