[package]
name = "canvasclip-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Núcleo de CanvasClip: base de datos, almacenamiento, ingesta y retención. Sin dependencias de UI."

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
blake3 = "1.8"
uuid = { version = "1.18", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
