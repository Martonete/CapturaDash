[workspace]
members = ["core"]
resolver = "2"

[package]
name = "canvasclip"
version = "0.1.0"
description = "CanvasClip — historial visual de capturas para Windows"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "canvasclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
canvasclip-core = { path = "core" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# Las dependencias de imágenes se compilan optimizadas también en debug:
# decodificar/codificar PNG sin optimizar es 10–20x más lento.
[profile.dev.package."*"]
opt-level = 2
