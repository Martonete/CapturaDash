name: Windows build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas del frontend
        run: npm test

      # tauri::generate_context! necesita dist/ al compilar el crate de la app.
      - name: Compilar frontend
        run: npm run build

      - name: Pruebas de Rust (núcleo + app, en Windows)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Compilar instalador
        run: npx tauri build

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: CanvasClip-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
